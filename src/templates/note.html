<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>document.documentElement.classList.add('js');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%%TITLE%% — Vulkon</title>
    <meta name="description" content="%%SUMMARY%%" />
    <meta name="theme-color" content="#F3EFE6" />
    %%ROBOTS%%
    <meta property="og:title" content="%%TITLE%% — Vulkon" />
    <meta property="og:type" content="article" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:description" content="%%SUMMARY%%" />
    %%SEO%%
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2316150F'/%3E%3Ctext x='50' y='70' text-anchor='middle' font-family='Georgia,serif' font-size='58' fill='%23F3EFE6'%3EV%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body id="top" class="os-page">
    <a class="skip" href="#main">رفتن به محتوا</a>

    <div class="progress" id="progress" aria-hidden="true"><span></span></div>

    <header class="masthead" id="masthead">
      <div class="wrap masthead__inner">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">VK</span>
          <span class="brand__name">Vulkon</span>
        </a>
        <nav class="nav" aria-label="اصلی">
          <a href="/#chapters" class="nav__link">فصل‌ها</a>
          <a href="/#about" class="nav__link">درباره</a>
          <a href="https://github.com/LigerTheTextRovert/vulkon" target="_blank" rel="noopener noreferrer" class="nav__link">گیت‌هاب ↗</a>
        </nav>
      </div>
    </header>

    <main id="main">
      <div class="wrap note__wrap">
        <div class="note__bar" data-reveal>
          <p class="label note__back"><a href="/"><span aria-hidden="true">→</span> فهرست فصل‌ها</a></p>
          <p class="label label--dim note__stamp">
            <span>انتشار</span>
            <time datetime="%%DATE_ISO%%">%%DATE_HUMAN%%</time>
            <span aria-hidden="true">·</span>
            <span>%%MINUTES%% دقیقه مطالعه</span>
          </p>
        </div>

        <article class="note" lang="fa" dir="rtl">
          <header class="note__head" data-reveal>
            <h1 class="note__title">%%TITLE%%</h1>
            <p class="note__summary">%%SUMMARY%%</p>
            %%TAGS%%
            %%MODE_BADGE%%
          </header>

          <div class="prose" data-reveal>
%%BODY%%
          </div>
        </article>
        %%SERIES_NAV%%
        %%SOURCE%%
      </div>
    </main>

    <footer class="footer">
      <div class="wrap footer__inner">
        <span>© ۲۰۲۶ Abolfazl Samarghandi · پروژه Vulkon</span>
        <span class="footer__colophon">حروف‌چینی با Vazirmatn</span>
        <a class="link link--quiet" href="/#top">بازگشت به بالا ↑</a>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
